name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */5 * *'  # a cada 5 dias ao meio-dia UTC
  workflow_dispatch:         # permite rodar manualmente se precisar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/companies?select=id&limit=1"
          echo "Ping enviado com sucesso"
